<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swarm Inspection — Sunseeker Predator 55</title>
    <style>
      :root {
        --bg: #07090c;
        --panel: #0d1117;
        --line: #21262d;
        --text: #c9d1d9;
        --dim: #6e7681;
        --ok: #68d391;
        --arch: #ff5f56;
        --det: #8b949e;
        --accent: #4fd1c5;
        --warm: #ffb454;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        overflow: hidden;
      }
      #app { display: flex; height: 100%; }
      #stage { flex: 1 1 auto; position: relative; outline: none; }
      #side {
        flex: 0 0 380px;
        overflow-y: auto;
        border-left: 1px solid var(--line);
        background: var(--panel);
        padding: 14px 16px 40px;
      }

      /* ---- title block ---- */
      #title { position: absolute; left: 26px; top: 24px; pointer-events: none; }
      #title .eyebrow {
        font-size: 10px; letter-spacing: 0.34em; color: var(--accent);
        text-transform: uppercase; margin-bottom: 8px;
      }
      #title h1 {
        margin: 0; font-size: 30px; line-height: 1.05; font-weight: 500;
        letter-spacing: -0.01em; color: #e6edf3;
      }
      #title .sub { margin-top: 8px; color: var(--dim); font-size: 11px; letter-spacing: 0.06em; }

      /* ---- stat block ---- */
      #stats {
        position: absolute; right: 26px; top: 24px; text-align: right; pointer-events: none;
      }
      #stats .stat { margin-bottom: 16px; }
      #stats .v { font-size: 26px; line-height: 1; color: #e6edf3; }
      #stats .v.arch { color: var(--arch); }
      #stats .k {
        font-size: 9px; letter-spacing: 0.2em; color: var(--dim); text-transform: uppercase; margin-top: 5px;
      }

      /* ---- verdict list ---- */
      #verdict {
        position: absolute; left: 26px; bottom: 96px; list-style: none; margin: 0; padding: 0;
        pointer-events: none; width: 340px;
      }
      #verdict li {
        display: flex; gap: 10px; align-items: baseline; padding: 1px 0; font-size: 11px;
      }
      #verdict .vid { color: var(--dim); width: 42px; }
      #verdict .vcls { flex: 1 1 auto; color: var(--text); }
      #verdict .vkind { letter-spacing: 0.12em; font-size: 9px; }
      #verdict li.ok .vkind { color: var(--ok); }
      #verdict li.arch .vkind { color: var(--arch); }
      #verdict li.det .vkind { color: var(--det); }
      #verdict li.arch .vcls { color: #ffb3ae; }

      /* ---- transport ---- */
      #transport {
        position: absolute; left: 26px; right: 26px; bottom: 22px;
        display: flex; align-items: center; gap: 16px;
      }
      #transport input[type=range] { flex: 1 1 auto; accent-color: var(--accent); height: 3px; }
      button {
        background: transparent; color: var(--text); border: 1px solid var(--line);
        border-radius: 3px; padding: 4px 11px; cursor: pointer; font: inherit; font-size: 11px;
        letter-spacing: 0.08em; text-transform: uppercase;
      }
      button:hover { border-color: var(--dim); }
      button.on { color: var(--accent); border-color: var(--accent); }
      #tick, #coverage { color: var(--dim); white-space: nowrap; font-size: 11px; }

      /* ---- boot ---- */
      #boot {
        position: absolute; inset: 0; background: var(--bg); z-index: 20;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        transition: opacity 600ms ease;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot .eyebrow { font-size: 10px; letter-spacing: 0.34em; color: var(--accent); text-transform: uppercase; }
      #boot h2 { margin: 0; font-weight: 500; font-size: 22px; color: #e6edf3; }
      #boottrack { width: 320px; height: 2px; background: #1c2128; }
      #bootbar { height: 100%; width: 0%; background: var(--accent); transition: width 120ms linear; }
      #bootnote { color: var(--dim); font-size: 11px; }

      /* ---- side panel ---- */
      h2 { font-size: 14px; margin: 0 0 4px; color: var(--accent); }
      h3 { font-size: 10px; margin: 18px 0 5px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.18em; }
      p.sub { color: var(--dim); margin: 0 0 6px; }
      p.miss { color: var(--dim); margin: 0 0 10px; font-size: 11px; }
      p.miss.arch { color: #ffb3ae; }
      p.miss b { color: inherit; }
      table { width: 100%; border-collapse: collapse; }
      td { padding: 2px 4px; vertical-align: top; }
      td.det { color: var(--dim); font-size: 11px; }
      tr.warn td:first-child { color: var(--arch); }
      .warn { color: var(--arch); }
      ul { margin: 4px 0; padding-left: 16px; }
      ul li { color: var(--dim); font-size: 11px; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage" tabindex="0">
        <div id="title">
          <div class="eyebrow">Swarm Inspection</div>
          <h1>Sunseeker Predator 55<br />midships section</h1>
          <div class="sub">17.14 m &middot; 4.93 m beam &middot; 200 mm deck hatches</div>
        </div>

        <div id="stats">
          <div class="stat">
            <div class="v" id="hud-coverage">—</div>
            <div class="k">Engine room covered</div>
          </div>
          <div class="stat">
            <div class="v" id="hud-found">—</div>
            <div class="k">Faults found</div>
          </div>
          <div class="stat">
            <div class="v arch" id="hud-miss">—</div>
            <div class="k">Architectural misses</div>
          </div>
        </div>

        <ul id="verdict"></ul>

        <div id="transport">
          <button id="cut" title="scripted camera">cinematic</button>
          <button id="play">pause</button>
          <span id="tick">tick 0</span>
          <input id="scrub" type="range" min="0" max="1" value="0" step="1" />
          <span id="coverage">boat coverage 0.0%</span>
        </div>

        <div id="boot">
          <div class="eyebrow">Swarm Inspection</div>
          <h2>running the swarm on the vessel</h2>
          <div id="boottrack"><div id="bootbar"></div></div>
          <div id="bootnote">tick 0 of 3000</div>
        </div>
      </div>
      <div id="side"></div>
    </div>
    <script type="module" src="/src/view/yacht-main.ts"></script>
  </body>
</html>
