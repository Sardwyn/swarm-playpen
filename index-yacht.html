<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swarm Inspection — Sunseeker Predator 55</title>
    <style>
      :root {
        --bg: #05070a;
        --panel: rgba(9, 13, 18, 0.86);
        --panel-solid: #090d12;
        --line: #1b2530;
        --line-hot: #2b3a49;
        --text: #b9c6d2;
        --text-dim: #5d6b7a;
        --text-hot: #e6edf3;
        --teal: #4fd1c5;
        --amber: #ffb454;
        --green: #68d391;
        --red: #ff5f56;
        --violet: #c792ea;
        --yellow: #f6e05e;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        overflow: hidden;
        letter-spacing: 0.01em;
      }
      #app { position: relative; height: 100%; }
      #stage { position: absolute; inset: 0; outline: none; }
      #stage canvas { display: block; }

      /* A vignette, so the console reads as a screen and not as a page. */
      #vignette {
        position: absolute; inset: 0; pointer-events: none; z-index: 2;
        background:
          radial-gradient(120% 90% at 50% 45%, transparent 45%, rgba(0,0,0,0.55) 100%),
          repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 3px);
      }

      /* ---- screen-space lock-on tags ---- */
      #tags { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
      .lock {
        position: absolute; top: 0; left: 0;
        transform: translate(-50%, -50%);
        display: none; align-items: center; gap: 7px;
        padding: 3px 8px;
        background: rgba(5, 9, 13, 0.72);
        border: 1px solid var(--line-hot);
        border-left: 2px solid var(--teal);
        white-space: nowrap;
        font-size: 10px;
        color: var(--text-hot);
        letter-spacing: 0.08em;
      }
      .lock b { font-weight: 600; color: var(--teal); }
      .lock span { color: var(--text-dim); letter-spacing: 0.04em; }
      .lock.bad { border-left-color: var(--red); }
      .lock.bad b { color: var(--red); }

      /* ---- the console grid ---- */
      #console { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
      .console {
        position: absolute; inset: 0;
        display: grid;
        grid-template-columns: 292px 1fr 316px;
        grid-template-rows: 44px 1fr 50px;
        grid-template-areas: "top top top" "left mid right" "foot foot foot";
      }
      .topbar {
        grid-area: top;
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 16px;
        background: linear-gradient(180deg, rgba(9,13,18,0.95), rgba(9,13,18,0.62));
        border-bottom: 1px solid var(--line);
        pointer-events: auto;
      }
      .brand { display: flex; align-items: center; gap: 10px; }
      .mark {
        width: 9px; height: 9px; border-radius: 50%;
        background: var(--teal);
        box-shadow: 0 0 10px var(--teal), 0 0 22px rgba(79,209,197,0.5);
        animation: pulse 2.6s ease-in-out infinite;
      }
      @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.35 } }
      .title { color: var(--text-hot); letter-spacing: 0.24em; font-size: 11px; }
      .sep { color: var(--text-dim); }
      .vessel { color: var(--text-dim); letter-spacing: 0.04em; }
      .topstats { display: flex; gap: 22px; align-items: center; }
      .tstat { text-align: right; }
      .tstat b { display: block; font-size: 13px; color: var(--text-hot); font-weight: 500; }
      .tstat i {
        display: block; font-style: normal; font-size: 8.5px; color: var(--text-dim);
        letter-spacing: 0.18em; text-transform: uppercase; margin-top: 1px;
      }
      .tstat.alarm b { color: var(--red); }

      .rail {
        pointer-events: auto;
        display: flex; flex-direction: column; gap: 1px;
        background: var(--line);
        overflow: hidden;
      }
      .rail.left { grid-area: left; }
      .rail.right { grid-area: right; }
      .block {
        background: var(--panel);
        backdrop-filter: blur(3px);
        padding: 9px 12px 11px;
        overflow: hidden;
        display: flex; flex-direction: column;
      }
      .block.grow { flex: 1 1 auto; min-height: 0; }
      .block h2 {
        margin: 0 0 8px; font-size: 8.5px; font-weight: 600; color: var(--text-dim);
        letter-spacing: 0.22em; text-transform: uppercase;
        border-bottom: 1px solid var(--line); padding-bottom: 5px;
      }

      /* ---- agent cards ---- */
      .agent {
        border: 1px solid var(--line); border-left: 2px solid var(--agent);
        background: rgba(255,255,255,0.015);
        padding: 6px 8px 7px; margin-bottom: 6px;
      }
      .ahead { display: flex; justify-content: space-between; align-items: baseline; }
      .aname { color: var(--agent); font-size: 11px; letter-spacing: 0.12em; }
      .arole { color: var(--text-dim); font-size: 9px; }
      .abatt { display: flex; align-items: center; gap: 7px; margin-top: 5px; }
      .abar { flex: 1 1 auto; height: 3px; background: #141c24; overflow: hidden; }
      .afill { height: 100%; width: 100%; background: var(--agent); transition: width 120ms linear; }
      .apct { color: var(--text-dim); font-size: 9px; min-width: 30px; text-align: right; }
      .astate {
        margin-top: 4px; font-size: 9px; color: var(--text-dim);
        letter-spacing: 0.14em; text-transform: uppercase;
      }
      .astate.bad { color: var(--red); }

      /* ---- tables ---- */
      table { width: 100%; border-collapse: collapse; }
      td { padding: 1.5px 0; vertical-align: top; color: var(--text-dim); }
      td.v, td.det { color: var(--text); text-align: right; }
      td.v { color: var(--text-hot); }

      /* ---- plan view ---- */
      #c-minimap {
        width: 100%; height: auto; display: block;
        border: 1px solid var(--line); background: #080b0f;
      }
      .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
      .legend span { display: flex; align-items: center; gap: 4px; color: var(--text-dim); font-size: 9px; }
      .legend i { width: 7px; height: 7px; display: inline-block; }

      /* ---- event stream ---- */
      #c-events {
        list-style: none; margin: 0; padding: 0; flex: 1 1 auto; min-height: 0;
        overflow-y: auto; font-size: 10px;
      }
      #c-events li { display: flex; gap: 8px; padding: 1px 0; border-bottom: 1px solid rgba(27,37,48,0.5); }
      .evt { color: var(--text-dim); min-width: 46px; }
      .evk { color: var(--text); letter-spacing: 0.04em; }
      .evk.anomaly-candidate { color: var(--yellow); }
      .evk.job-awarded, .evk.job-done { color: var(--teal); }
      .evk.agent-faulted, .evk.job-failed { color: var(--red); }

      /* ---- findings ---- */
      #c-findings { list-style: none; margin: 0; padding: 0; font-size: 10px; max-height: 250px; overflow-y: auto; }
      #c-findings li { display: flex; gap: 7px; align-items: center; padding: 2.5px 0; }
      #c-findings li.empty { color: var(--text-dim); }
      .fid { color: var(--text-dim); min-width: 58px; }
      .fdet { color: var(--text); flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .fbar { width: 44px; height: 3px; background: #141c24; }
      .fbar i { display: block; height: 100%; background: var(--yellow); }
      .fcf { color: var(--text-dim); min-width: 26px; text-align: right; }
      #c-findings li.un .fdet { color: var(--text-dim); }
      #c-findings li.un .fbar i { background: var(--text-dim); }

      /* ---- transport ---- */
      .transport {
        grid-area: foot;
        display: flex; align-items: center; gap: 12px; padding: 0 16px;
        background: linear-gradient(0deg, rgba(9,13,18,0.96), rgba(9,13,18,0.7));
        border-top: 1px solid var(--line);
        pointer-events: auto;
      }
      .tbtn {
        background: transparent; color: var(--text-dim); border: 1px solid var(--line);
        border-radius: 2px; padding: 4px 10px; cursor: pointer; font: inherit;
        font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase;
      }
      .tbtn:hover { color: var(--text-hot); border-color: var(--line-hot); }
      .tbtn.on { color: var(--teal); border-color: var(--teal); }
      .track { position: relative; flex: 1 1 auto; height: 30px; }
      #c-timeline {
        position: absolute; left: 0; right: 0; bottom: 9px; height: 16px;
        display: flex; align-items: flex-end; gap: 1px; opacity: 0.75;
      }
      #c-timeline i {
        flex: 1 1 auto; background: linear-gradient(180deg, var(--teal), rgba(79,209,197,0.12));
        min-height: 1px;
      }
      #c-scrub {
        position: absolute; left: 0; right: 0; bottom: 0; width: 100%;
        margin: 0; height: 14px; accent-color: var(--teal);
      }
      #c-head {
        position: absolute; bottom: 4px; width: 1px; height: 24px;
        background: var(--amber); box-shadow: 0 0 6px var(--amber); pointer-events: none;
      }
      .shotname {
        color: var(--teal); font-size: 10px; letter-spacing: 0.2em; min-width: 210px;
        text-align: right;
      }

      /* ---- no WebGL: the readout carries on without the picture ---- */
      #nogpu {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 12px; color: var(--text-dim);
        text-align: center; padding: 0 340px;
      }
      #nogpu b { color: var(--red); letter-spacing: 0.24em; font-size: 11px; }
      #nogpu span { max-width: 360px; line-height: 1.8; }
      .console.flat { grid-template-columns: 360px 1fr 440px; }

      /* ---- the caption ---- */
      #caption {
        position: absolute; left: 50%; transform: translateX(-50%);
        bottom: 66px; z-index: 3; pointer-events: none;
        width: min(640px, 46vw); text-align: center;
      }
      #caption b {
        display: block; font-size: 12px; letter-spacing: 0.28em; color: var(--teal);
        font-weight: 500; text-shadow: 0 0 14px rgba(0,0,0,0.9);
      }
      #caption p {
        margin: 7px 0 0; font-size: 12px; line-height: 1.6; color: var(--text-hot);
        text-shadow: 0 0 14px rgba(0,0,0,0.95), 0 0 4px rgba(0,0,0,0.9);
      }
      #caption span {
        display: block; margin-top: 6px; font-size: 10px; letter-spacing: 0.12em;
        color: var(--text-dim); text-shadow: 0 0 10px rgba(0,0,0,0.9);
      }

      /* ---- the report drawer ---- */
      #side {
        position: absolute; top: 44px; right: 0; bottom: 50px; width: 380px;
        background: var(--panel-solid); border-left: 1px solid var(--line);
        overflow-y: auto; padding: 14px 16px 40px; z-index: 6;
        transform: translateX(100%); transition: transform 220ms ease;
      }
      #side.open { transform: translateX(0); }
      #side h2 { font-size: 13px; margin: 0 0 4px; color: var(--teal); letter-spacing: 0.04em; }
      #side h3 {
        font-size: 9px; margin: 18px 0 5px; color: var(--text-dim);
        text-transform: uppercase; letter-spacing: 0.2em;
      }
      #side p.sub { color: var(--text-dim); margin: 0 0 6px; }
      #side p.miss { color: var(--text-dim); margin: 0 0 10px; font-size: 10.5px; }
      #side p.miss.arch { color: #ffb3ae; }
      #side p.miss .sig { color: var(--teal); letter-spacing: 0.1em; }
      #side .warn { color: var(--red); }
      #side ul { margin: 4px 0; padding-left: 16px; }
      #side ul li { color: var(--text-dim); font-size: 10px; }
      #side td { color: var(--text-dim); }
      #side td.det { color: var(--text); text-align: right; font-size: 10px; }

      /* ---- boot ---- */
      #boot {
        position: absolute; inset: 0; background: var(--bg); z-index: 20;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        transition: opacity 500ms ease;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot .eyebrow { font-size: 10px; letter-spacing: 0.34em; color: var(--teal); text-transform: uppercase; }
      #boot h2 { margin: 0; font-weight: 500; font-size: 20px; color: var(--text-hot); letter-spacing: 0.04em; }
      #boottrack { width: 300px; height: 2px; background: #141c24; }
      #bootbar { height: 100%; width: 0%; background: var(--teal); transition: width 120ms linear; }
      #bootnote { color: var(--text-dim); font-size: 10px; letter-spacing: 0.1em; }

      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #1e2833; }
      ::-webkit-scrollbar-thumb:hover { background: #2b3a49; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage" tabindex="0"></div>
      <div id="vignette"></div>
      <div id="tags"></div>
      <div id="caption">
        <b id="cap-shot">—</b>
        <p id="cap-line">—</p>
        <span id="cap-live"></span>
      </div>
      <div id="console"></div>
      <div id="side"></div>
      <div id="boot">
        <div class="eyebrow">Swarm Inspection</div>
        <h2>running the swarm on the vessel</h2>
        <div id="boottrack"><div id="bootbar"></div></div>
        <div id="bootnote">tick 0 of 3000</div>
      </div>
    </div>
    <script type="module" src="/src/view/yacht-main.ts"></script>
  </body>
</html>
