<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swarm on a Sunseeker — measured coverage</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --line: #30363d;
        --text: #c9d1d9;
        --dim: #8b949e;
        --ok: #68d391;
        --warn: #ed8936;
        --accent: #4fd1c5;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #app { display: flex; height: 100%; }
      #stage { flex: 1 1 auto; position: relative; outline: none; }
      #side {
        flex: 0 0 420px;
        overflow-y: auto;
        border-left: 1px solid var(--line);
        background: var(--panel);
        padding: 12px 14px;
      }
      #legend {
        position: absolute;
        left: 12px;
        bottom: 66px;
        padding: 8px 12px;
        background: rgba(13, 17, 23, 0.82);
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--dim);
        pointer-events: none;
        line-height: 1.7;
      }
      #legend b { color: var(--text); font-weight: 500; }
      .swatch { display: inline-block; width: 9px; height: 9px; margin-right: 6px; vertical-align: baseline; }
      #transport {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 10px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        background: rgba(13, 17, 23, 0.88);
        border: 1px solid var(--line);
        border-radius: 4px;
        pointer-events: auto;
      }
      #transport input[type=range] { flex: 1 1 auto; accent-color: var(--accent); }
      button {
        background: #1f6feb; color: #fff; border: 0; border-radius: 3px;
        padding: 3px 12px; cursor: pointer; font: inherit;
      }
      #tick, #coverage { color: var(--dim); white-space: nowrap; }
      h2 { font-size: 14px; margin: 0 0 2px; color: var(--accent); }
      h3 { font-size: 12px; margin: 16px 0 4px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; }
      p.sub { color: var(--dim); margin: 0 0 6px; }
      table { width: 100%; border-collapse: collapse; }
      th { text-align: left; color: var(--dim); font-weight: 500; padding: 2px 4px; }
      td { padding: 2px 4px; vertical-align: top; }
      td.det { color: var(--dim); font-size: 11px; }
      tr.ok td:first-child { color: var(--ok); }
      tr.warn td:first-child { color: var(--warn); }
      tr.muted td { color: var(--dim); }
      .warn { color: var(--warn); }
      .ok { color: var(--ok); }
      ul { margin: 4px 0; padding-left: 18px; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage" tabindex="0">
        <div id="legend">
          <div><span class="swatch" style="background:#4fd1c5"></span><b>ground coverage</b> — cells looked at twice</div>
          <div><span class="swatch" style="background:#63b3ed"></span><b>volumetric coverage</b> — the hover bot's raster</div>
          <div><span class="swatch" style="background:#6b3030"></span><b>unreachable</b> — no agent in the swarm can get there</div>
          <div><span class="swatch" style="background:#f6e05e"></span><b>finding</b> · <span class="swatch" style="background:#b794f4"></span><b>authored fault</b></div>
        </div>
        <div id="transport">
          <button id="play">❚❚ pause</button>
          <span id="tick">tick 0</span>
          <input id="scrub" type="range" min="0" max="1" value="0" step="1" />
          <span id="coverage">ground coverage 0.0%</span>
        </div>
      </div>
      <div id="side"></div>
    </div>
    <script type="module" src="/src/view/yacht-main.ts"></script>
  </body>
</html>
